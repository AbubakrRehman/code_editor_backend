version: '3.8'

services:
  postgres:
    image: postgres:17.4-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    image: backend:v1.0
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # - .:/app
      - /app/node_modules

volumes:
  postgres_data:
  node_modules:
